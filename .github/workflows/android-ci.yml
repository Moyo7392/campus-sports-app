name: Android CI
on:
  pull_request: { branches: [main, dev] }
  push: { branches: [main, dev] }

permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
      - name: Configure isolated CI Firebase project
        run: cp .github/fixtures/google-services.ci.json android-app/app/google-services.json
      - name: Build & test
        working-directory: android-app
        run: ./gradlew clean lintDebug testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
